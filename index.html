<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Stimmgerät</title>
<style>
:root{--bg:#E4EAE6;--ink:#17201C;--mute:#566660;--line:#B3BFB8;--panel:#D5DDD8;--ok:#2C7A57;--off:#B5452E;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101614;--ink:#E3EBE6;--mute:#8A9A92;--line:#2A3631;--panel:#18211D;--ok:#5BC48F;--off:#E2745B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101614;--ink:#E3EBE6;--mute:#8A9A92;--line:#2A3631;--panel:#18211D;--ok:#5BC48F;--off:#E2745B;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:28rem;padding:1.5rem 1.25rem;display:flex;flex-direction:column;gap:1.5rem;justify-content:center}
h1{font-size:1rem;font-weight:600;margin:0;color:var(--mute)}
.note{font-family:"Iowan Old Style",Georgia,serif;font-size:min(34vw,9rem);line-height:1;text-align:center;margin:0;min-height:1em;font-variant-numeric:lining-nums}
.note small{font-size:.28em;color:var(--mute);margin-left:.08em}
.read{display:flex;justify-content:space-between;color:var(--mute);font-size:1rem;font-variant-numeric:tabular-nums}
.read b{color:var(--ink);font-weight:600}
.gauge{width:100%;height:auto;display:block}
.arc{fill:none;stroke:var(--line);stroke-width:2}
.zone{fill:none;stroke:color-mix(in srgb,var(--ok) 45%,transparent);stroke-width:14}
.tick{stroke:var(--mute);stroke-width:2}
.lab{fill:var(--mute);font-size:12px;text-anchor:middle}
.needle{transform-origin:150px 160px;transition:transform .12s linear;opacity:.35}
.needle line{stroke:var(--mute);stroke-width:3;stroke-linecap:round}
.needle circle{fill:var(--mute)}
.needle.live{opacity:1}.needle.live line{stroke:var(--off)}.needle.live circle{fill:var(--off)}
.needle.ok{opacity:1}.needle.ok line{stroke:var(--ok)}.needle.ok circle{fill:var(--ok)}
.strings{display:flex;gap:.5rem}
.strings span{flex:1;text-align:center;padding:.7rem 0;border-radius:.5rem;border:1px solid var(--line);color:var(--mute);font-weight:600}
.strings span.on{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.ref{display:flex;align-items:center;justify-content:space-between;color:var(--mute)}
.ref div{display:flex;align-items:center;gap:.75rem;color:var(--ink);font-variant-numeric:tabular-nums}
select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:.5rem;height:2.75rem;padding:0 .75rem}
.ref select{max-width:65%}
select:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:.5rem;min-width:2.75rem;height:2.75rem;cursor:pointer}
button:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
#go{width:100%;background:var(--ok);border-color:var(--ok);color:var(--bg);font-weight:600;font-size:1.1rem;height:3.25rem}
#msg{margin:0;text-align:center;color:var(--mute);min-height:2.6em;font-size:.95rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Stimmgerät</h1>
  <p class="note" id="note" aria-live="polite">–</p>
  <div class="read"><span><b id="cents">–</b> Cent</span><span><b id="hz">–</b> Hz</span></div>
  <svg class="gauge" viewBox="0 0 300 175" role="img" aria-label="Zeigerinstrument für die Abweichung in Cent">
    <path class="arc" d="M 46.08 100 A 120 120 0 0 1 253.92 100"/>
    <path class="zone" d="M 137.46 40.66 A 120 120 0 0 1 162.54 40.66"/>
    <line class="tick" x1="150" y1="52" x2="150" y2="36"/>
    <line class="tick" x1="204" y1="66.47" x2="212" y2="52.61"/>
    <line class="tick" x1="96" y1="66.47" x2="88" y2="52.61"/>
    <line class="tick" x1="243.53" y1="106" x2="257.38" y2="98"/>
    <line class="tick" x1="56.47" y1="106" x2="42.62" y2="98"/>
    <text class="lab" x="150" y="22">0</text>
    <text class="lab" x="273" y="92">+50</text>
    <text class="lab" x="27" y="92">−50</text>
    <g class="needle" id="needle"><line x1="150" y1="160" x2="150" y2="48"/><circle cx="150" cy="160" r="8"/></g>
  </svg>
  <div class="ref"><label for="inst">Instrument</label><select id="inst"></select></div>
  <div class="ref"><label for="tr">Anzeige</label><select id="tr"><option value="0">Klingend (Konzertton)</option><option value="2">B-Instrument (Trompete, Klarinette)</option><option value="9">Es-Instrument (Altsaxophon)</option><option value="7">F-Instrument (Horn)</option></select></div>
  <div class="strings" id="strings"></div>
  <div class="ref"><span>Kammerton a</span><div><button id="dn" aria-label="Kammerton tiefer">−</button><span id="refv">440 Hz</span><button id="up" aria-label="Kammerton höher">+</button></div></div>
  <button id="go">Mikrofon starten</button>
  <p id="msg"></p>
</main>
<script>
const $=id=>document.getElementById(id);
const NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','B♭','B'];
let ref=440;
try{const s=parseInt(localStorage.getItem('ref'),10);if(s>=430&&s<=450)ref=s}catch(e){}
function setRef(v){ref=Math.max(430,Math.min(450,v));$('refv').textContent=ref+' Hz';try{localStorage.setItem('ref',ref)}catch(e){}}
setRef(ref);
$('dn').onclick=()=>setRef(ref-1);
$('up').onclick=()=>setRef(ref+1);

// Instrumente: leere Saiten als MIDI-Noten, in Stimmreihenfolge
let tr=0;
try{const v=parseInt(localStorage.getItem('tr'),10);if([0,2,7,9].includes(v))tr=v}catch(e){}
$('tr').value=tr;
function label(m){const d=m+tr;return NAMES[((d%12)+12)%12]+(Math.floor(d/12)-1)}
const INST={'Chromatisch (alle Töne)':[],'Kontrabass':[28,33,38,43],'Gitarre':[40,45,50,55,59,64],'Violine':[55,62,69,76],'Bratsche':[48,55,62,69],'Cello':[36,43,50,57],'Ukulele':[67,60,64,69],'Trompete':[58,65,70,74,77]};
const sel=$('inst');
Object.keys(INST).forEach(k=>{const o=document.createElement('option');o.textContent=k;sel.appendChild(o)});
function setInst(k){
  if(!INST[k])k='Chromatisch (alle Töne)';
  sel.value=k;
  const box=$('strings');box.innerHTML='';box.hidden=!INST[k].length;
  INST[k].forEach(m=>{const e=document.createElement('span');e.dataset.m=m;e.textContent=label(m);box.appendChild(e)});
  try{localStorage.setItem('inst',k)}catch(e){}
}
sel.onchange=()=>setInst(sel.value);
$('tr').onchange=()=>{tr=+$('tr').value;try{localStorage.setItem('tr',tr)}catch(e){}setInst(sel.value);hist=[];idle()};
let savedInst='';try{savedInst=localStorage.getItem('inst')||''}catch(e){}
setInst(savedInst);


// Grundtonerkennung nach dem YIN-Verfahren, ausgelegt auf 30–1400 Hz
function yin(x,sr){
  const W=4096,tmax=Math.floor(sr/30),tmin=Math.floor(sr/1400);
  if(x.length<W+tmax)return -1;
  const c=new Float32Array(tmax+1);let run=0;c[0]=1;
  for(let t=1;t<=tmax;t++){
    let s=0;for(let j=0;j<W;j++){const v=x[j]-x[j+t];s+=v*v}
    run+=s;c[t]=s*t/run;
  }
  let t=tmin,found=false;
  for(;t<tmax;t++){if(c[t]<0.12){while(t+1<tmax&&c[t+1]<c[t])t++;found=true;break}}
  if(!found||t>=tmax-1)return -1;
  const a=c[t-1],b=c[t],e=c[t+1],den=a-2*b+e;
  return sr/(t+(den?0.5*(a-e)/den:0));
}

// Bildschirm anlassen, solange das Stimmgerät läuft
let wl=null,running=false;
async function keepAwake(){
  try{if('wakeLock' in navigator)wl=await navigator.wakeLock.request('screen')}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(running&&document.visibilityState==='visible')keepAwake()});

let ctx,an,buf,hist=[],last=0,quiet=0;
async function start(){
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    await ctx.resume();
    an=ctx.createAnalyser();an.fftSize=8192;an.smoothingTimeConstant=0;
    ctx.createMediaStreamSource(st).connect(an);
    buf=new Float32Array(an.fftSize);
    running=true;keepAwake();
    $('go').hidden=true;$('msg').textContent='Spiele einen Ton und lass ihn ausklingen.';
    requestAnimationFrame(tick);
  }catch(e){
    $('msg').textContent='Kein Mikrofonzugriff. Erlaube das Mikrofon für diese Seite in den Safari-Einstellungen und lade sie neu.';
  }
}
$('go').onclick=start;

function tick(t){
  requestAnimationFrame(tick);
  if(t-last<70)return;last=t;
  an.getFloatTimeDomainData(buf);
  let r=0;for(let i=0;i<buf.length;i++)r+=buf[i]*buf[i];
  if(Math.sqrt(r/buf.length)<0.008){if(++quiet>10)idle();return}
  quiet=0;
  const f=yin(buf,ctx.sampleRate);
  if(f<0)return;
  hist.push(f);if(hist.length>5)hist.shift();
  show([...hist].sort((a,b)=>a-b)[hist.length>>1]);
}

function show(f){
  const midi=12*Math.log2(f/ref)+69,n=Math.round(midi),c=(midi-n)*100;
  const ok=Math.abs(c)<=5;
  const d=n+tr;
  $('note').innerHTML=NAMES[((d%12)+12)%12]+'<small>'+(Math.floor(d/12)-1)+'</small>';
  $('cents').textContent=(c>0?'+':c<0?'−':'')+Math.abs(c).toFixed(0);
  $('hz').textContent=f.toFixed(1);
  const nd=$('needle');
  nd.style.transform='rotate('+(Math.max(-50,Math.min(50,c))*1.2)+'deg)';
  nd.setAttribute('class','needle '+(ok?'ok':'live'));
  document.querySelectorAll('#strings span').forEach(s=>s.classList.toggle('on',+s.dataset.m===n));
}
function idle(){
  hist=[];
  $('note').textContent='–';$('cents').textContent='–';$('hz').textContent='–';
  const nd=$('needle');nd.style.transform='rotate(0deg)';nd.setAttribute('class','needle');
  document.querySelectorAll('#strings span').forEach(s=>s.classList.remove('on'));
}
</script>
</body>
</html>
